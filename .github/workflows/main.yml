name: main

on:
  push:
    branches:
      - main
  # run every Wednesday at midnight UTC
  schedule:
    - cron: '0 0 * * 3'

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

jobs:
  build:
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
  check-docs:
    uses: $/.github/workflows/check-docs.yml
    permissions:
      contents: read
  smoke-tests:
    needs: [build]
    uses: $/.github/workflows/smoke-tests.yml
    permissions:
      contents: read
  static-analysis:
    uses: $/.github/workflows/static-analysis.yml
    permissions:
      contents: read
  unit-tests:
    needs: [build]
    uses: $/.github/workflows/unit-tests.yml
    permissions:
      contents: read
