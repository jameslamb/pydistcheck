name: pr

on:
  pull_request:
    branches:
      - main

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

jobs:
  # skip some expensive jobs if only files that cannot affect them were changed
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/actions/
            .github/ci-trigger-patterns/
          sparse-checkout-cone-mode: false
      - name: check if unit tests should run
        id: unit-tests
        uses: ./.github/actions/files-changed  # zizmor: ignore[self-repository]
        with:
          patterns-file: ./.github/ci-trigger-patterns/unit-tests.txt
          pr-number: ${{ github.event.pull_request.number }}
      - name: check if smoke tests should run
        id: smoke-tests
        uses: ./.github/actions/files-changed  # zizmor: ignore[self-repository]
        with:
          patterns-file: ./.github/ci-trigger-patterns/smoke-tests.txt
          pr-number: ${{ github.event.pull_request.number }}
    outputs:
      run_unit_tests: ${{ steps.unit-tests.outputs.matched }}
      run_smoke_tests: ${{ steps.smoke-tests.outputs.matched }}
  build:
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
  check-docs:
    uses: $/.github/workflows/check-docs.yml
    permissions:
      contents: read
  smoke-tests:
    needs: [build, changes]
    if: needs.changes.outputs.run_smoke_tests == 'true'
    uses: $/.github/workflows/smoke-tests.yml
    permissions:
      contents: read
  static-analysis:
    uses: $/.github/workflows/static-analysis.yml
    permissions:
      contents: read
  unit-tests:
    needs: [build, changes]
    if: needs.changes.outputs.run_unit_tests == 'true'
    uses: $/.github/workflows/unit-tests.yml
    permissions:
      contents: read
  all-required-pr-jobs:
    if: always()
    runs-on: ubuntu-slim
    needs:
      - build
      - changes
      - check-docs
      - smoke-tests
      - static-analysis
      - unit-tests
    permissions:
      statuses: read
    steps:
      - name: Note that all tests succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          # these are skipped if the PR doesn't change any files that affect them
          # (see the 'changes' job)
          allowed-skips: >-
            smoke-tests,
            unit-tests
          jobs: ${{ toJSON(needs) }}
