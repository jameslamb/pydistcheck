[project]

authors = [
  {name = "James Lamb", email = "jaylamb20@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development",
    "Topic :: Utilities"
]
dependencies = [
    "click>=8.0",
    "tomli>=1.1.0 ; python_version < '3.11'"
]
description = "Inspect Python package distributions and raise warnings on common problems."
keywords = [
    "linter",
    "python-packaging",
    "testing"
]
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "LICENSES/*"
]
maintainers = [
  {name = "James Lamb", email = "jaylamb20@gmail.com"}
]
name = "pydistcheck"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]

[project.scripts]
pydistcheck = "pydistcheck.cli:check"

[project.optional-dependencies]
conda = [
    "zstandard>=0.22.0 ; python_version < '3.14'"
]

[project.urls]
homepage = "https://pydistcheck.readthedocs.io/en/latest/"
documentation = "https://pydistcheck.readthedocs.io/en/latest/"
repository = "https://github.com/jameslamb/pydistcheck"
changelog = "https://github.com/jameslamb/pydistcheck/releases"

[build-system]
requires = [
    "hatchling>=1.27.0"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "src/pydistcheck/*.py",
    "LICENSE",
    "LICENSES/*"
]
exclude = [
    "README.md"
]
sources = ["src"]

[tool.hatch.version]
path = "src/pydistcheck/__init__.py"

[tool.coverage.report]
fail_under = 99.00
exclude_also = [
    # skip type-checking blocks when calculating code coverage
    "if TYPE_CHECKING:"
]

[tool.isort]
line_length = 88
profile = "black"

[tool.mypy]
exclude = 'docs/conf\.py$|build/*'
ignore_missing_imports = false
mypy_path = "./src:./tests/data"
strict = true

[[tool.mypy.overrides]]
module = ["compression", "compression.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers"
]
xfail_strict = true

[tool.rstcheck]
ignore_directives = [
    # rstcheck does not understand directives from extension 'sphinx-click'
    "click"
]

[tool.ruff]
line-length = 88
# this should be set to the oldest version of python the project supports
target-version = "py39"

[tool.ruff.lint]
ignore = [
    # (pydocstyle) 1-line docstring should fit on one line
    "D200",
    # (pydocstyle) incorrect blank line before class
    "D203",
    # (pydocstyle) 1 blank line required between summary line and description
    "D205",
    # (pydocstyle) Multi-line docstring summary should start at the first line
    "D212",
    # (pydocstyle) First line should end with a period
    "D400",
    # (pydocstyle) First line should end with a period, question mark, or exclamation point
    "D415",
    # (pycodestyle) Line too long
    "E501",
    # (flake8-no-pep420) no implicit namespace packages
    "INP001",
    # (pep8-naming) import of a lowercase name aliased as a non-lowercase name
    "N812",
    # (pylint) Magic value used in comparison, consider replacing with a constant
    "PLR2004",
    # (flake8-pytest-style) scope='function' is implied in @pytest.fixture()
    "PT003",
    # (flake8-pytest-style) Wrong values type in @pytest.mark.parametrize expected list of tuple
    "PT007",
    # (flake8-use-pathlib)
    "PTH",
    # (flake8-bandit) subprocess call: check for execution of untrusted input
    "S603",
    # (flake8-simplify) use ternary operator instead of if-else
    "SIM108",
    # (flake8-print) 'print' found
    "T201",
    # (tryceratops) move return statements to 'else' block
    "TRY300"
]
select = [
    "ALL"
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"bin/*" = [
    # (flake8-copyright)
    "CPY001",
    # (pydocstyle)
    "D",
]
"docs/*" = [
    # (flake8-copyright)
    "CPY001",
    # (pydocstyle)
    "D",
]
"src/pydistcheck/*.py" = [
    # (flake8-bandit) uses of tarfile.extractall()
    "S202"
]
"src/pydistcheck/cli.py" = [
    # (pylint) 'import' should be at the top-level of a file
    "PLC0415",
    # (pylint) Too many branches
    "PLR0912",
    # (pylint) Too many statements
    "PLR0915"
]
"src/pydistcheck/_compat.py" = [
    # (flake8-annotations) typing.Any disallowed ... a bit complicated when a function returns a module
    "ANN401"
]
"src/pydistcheck/_distribution_summary.py" = [
    # (pylint) Too many branches
    "PLR0912"
]
"tests/*" = [
    # (flake8-annotations)
    "ANN",
    # (pydocstyle)
    "D",
    # (flake8-bugbear) Found useless expression
    "B018",
    # (flake8-bandit) use of assert detected
    "S101",
    # (flake8-self) Private member accessed
    "SLF001",
]
"tests/data/*" = [
    # (flake8-copyright) Missing copyright notice at top of file
    "CPY001",
]
